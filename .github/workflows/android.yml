name: Android CI/CD & Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Determine Dynamic Version
      id: version
      run: |
        VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
        VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
        RELEASE_TAG="v${VERSION_NAME}"
        echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
        echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
        echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
        echo "Calculated Version: ${VERSION_NAME} (code ${VERSION_CODE}, tag ${RELEASE_TAG})"

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug -PversionCode=${{ steps.version.outputs.version_code }} -PversionName=${{ steps.version.outputs.version_name }}

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Run Lint Vital Release Check
      run: ./gradlew lintVitalRelease

    - name: Build Signed Release APK
      run: ./gradlew assembleRelease -PversionCode=${{ steps.version.outputs.version_code }} -PversionName=${{ steps.version.outputs.version_name }}

    - name: Package Distribution APKs
      run: |
        mkdir -p dist
        cp app/build/outputs/apk/release/app-release.apk dist/visualize-pdf-${{ steps.version.outputs.release_tag }}.apk
        cp app/build/outputs/apk/release/app-release.apk dist/visualize-pdf-latest.apk
        ls -lh dist/

    - name: Upload APKs as Artifact
      uses: actions/upload-artifact@v7
      with:
        name: app-distribution
        path: dist/
        retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          name: app-distribution
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: "Visualize PDF ${{ needs.build.outputs.release_tag }}"
          files: |
            dist/visualize-pdf-${{ needs.build.outputs.release_tag }}.apk
            dist/visualize-pdf-latest.apk
          generate_release_notes: true
          make_latest: true

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [build, release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          name: app-distribution
          path: dist

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare Website & Embed APK
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          # Embed the latest APK and versioned APK directly in the website root for instant download
          cp dist/visualize-pdf-latest.apk _site/
          cp dist/visualize-pdf-${{ needs.build.outputs.release_tag }}.apk _site/
          
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          APK_BYTES=$(wc -c < dist/visualize-pdf-latest.apk)
          APK_MB=$(awk "BEGIN {printf \"%.1f\", $APK_BYTES/1048576}")
          
          sed -i "s/{{VERSION}}/${{ needs.build.outputs.release_tag }}/g" _site/index.html
          sed -i "s/{{VERSION_NAME}}/${{ needs.build.outputs.version_name }}/g" _site/index.html
          sed -i "s/{{VERSION_CODE}}/${{ needs.build.outputs.version_code }}/g" _site/index.html
          sed -i "s/{{BUILD_DATE}}/${BUILD_DATE}/g" _site/index.html
          sed -i "s/{{COMMIT_SHORT}}/${COMMIT_SHORT}/g" _site/index.html
          sed -i "s/{{APK_SIZE}}/${APK_MB} MB/g" _site/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
